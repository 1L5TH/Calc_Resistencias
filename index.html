<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Circuitos y Resistencias (Kirchhoff MNA)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0) !important;
            outline: none !important;
        }

        body {
            background: linear-gradient(135deg, #051f30, #000000);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 25px 20px;
        }

        header {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            margin-top: 5px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
            margin-bottom: 8px;
        }

        h1 span {
            color: #B5E853;
            text-shadow: 0 0 25px rgba(181, 232, 83, 0.5);
        }

        .subtitle-info {
            font-size: 1.15rem;
            color: #a8b2c1;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: 'Rajdhani', sans-serif;
        }

        .cubeContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            z-index: 5;
            perspective: 1000px;
        }

        .cube {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            transform: rotateX(-30deg);
            animation: animate 15s linear infinite;
        }

        @keyframes animate {
            0% {
                transform: rotateX(-30deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(-30deg) rotateY(360deg);
            }
        }

        .cube div {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .cube div span {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(#051f30, #B5E853);
            transform: rotateY(calc(90deg * var(--i))) translateZ(150px);
        }

        .top {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 300px;
            background: linear-gradient(#051f30, #000000);
            transform: rotateX(90deg) translateZ(150px);
        }

        .top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 300px;
            background: #B5E853;
            transform: translateZ(-400px);
            filter: blur(25px);
            box-shadow: 0 0 100px rgba(181, 232, 83, .2),
                0 0 150px rgba(181, 232, 83, .4),
                0 0 250px rgba(181, 232, 83, .6),
                0 0 350px rgba(181, 232, 83, .8),
                0 0 450px rgba(181, 232, 83, 1);
        }

        .features-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        .feature-pill {
            background: rgba(5, 31, 48, 0.85);
            border: 1px solid rgba(181, 232, 83, 0.35);
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            color: #B5E853;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 18px rgba(181, 232, 83, 0.12);
            backdrop-filter: blur(8px);
        }

        .btn-enter {
            background: #B5E853;
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px 34px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(181, 232, 83, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 15px;
            z-index: 10;
        }

        .btn-enter:hover {
            background: #c5f863;
            box-shadow: 0 0 35px rgba(181, 232, 83, 0.7);
            transform: scale(1.03);
        }

        footer {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(181, 232, 83, 0.15);
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            .subtitle-info {
                font-size: 1rem;
            }
            .cube {
                width: 220px;
                height: 220px;
            }
            .top {
                width: 220px;
                height: 220px;
                transform: rotateX(90deg) translateZ(110px);
            }
            .cube div span {
                transform: rotateY(calc(90deg * var(--i))) translateZ(110px);
            }
            .feature-pill {
                font-size: 0.75rem;
                padding: 8px 14px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Calculadora de Circuitos y Resistencias <span>(Kirchhoff MNA)</span></h1>
    </header>

    <div class="cubeContainer">
        <div class="cube">
            <div class="top"></div>
            <div>
                <span style="--i:0"></span>
                <span style="--i:1"></span>
                <span style="--i:2"></span>
                <span style="--i:3"></span>
            </div>
        </div>
    </div>

    <div class="features-bar">
        <div class="feature-pill">
            <span class="material-symbols-outlined" style="font-size:18px;">calculate</span>
            Valores Comerciales (E12 / E24 / E96)
        </div>
        <div class="feature-pill">
            <span class="material-symbols-outlined" style="font-size:18px;">electric_bolt</span>
            Energía Suministrada
        </div>
    </div>

    <button class="btn-enter" onclick="startSim()">Iniciar Simulación</button>

    <footer>
        Torres Herrera Alejandro 3CM9 2026300123
    </footer>

    <script>
        function startSim() {
            const btn = document.querySelector('.btn-enter');
            btn.innerText = 'Cargando...';
            setTimeout(() => {
                btn.innerText = '¡Listo!';
                window.location.href = "calc.html"
            }, 700);
        }
    </script>
</body>

</html>
